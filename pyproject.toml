[project]
name = "paperless-mcp"
version = "0.1.0"
description = "MCP server for finding Paperless-ngx documents and reading their extracted fields"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.2.0,<3",
    "httpx2>=2.5.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.6.0",
    "pyjwt[crypto]>=2.10.1",
    "uvicorn>=0.31.1",
]

[project.scripts]
paperless-mcp = "paperless_mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperless_mcp"]

[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH", "RUF"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
